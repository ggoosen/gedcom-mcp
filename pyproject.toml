[project]
name = "gedcom-mcp"
version = "0.1.0"
description = "MCP server for reading, searching and editing GEDCOM (.ged) family-tree files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "gedcom", "genealogy", "ancestry"]
dependencies = [
    "mcp>=2.2,<3",
    "ged4py>=0.4.4",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "anyio>=4",
    "ruff>=0.7",
    "pyright>=1.1.389",
]

[project.scripts]
gedcom-mcp = "gedcom_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gedcom_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF023", "RUF001", "E501"]
